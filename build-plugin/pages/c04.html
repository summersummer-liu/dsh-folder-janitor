<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><title>插件推广 4</title><style>@page{size:1080px 1440px;margin:0}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#F5F1E8}
body{width:1080px;font-family:"Microsoft YaHei","Noto Sans SC",sans-serif;color:#16130F;
  -webkit-print-color-adjust:exact;print-color-adjust:exact}
.page{width:1080px;height:1440px;padding:84px 80px 118px;position:relative;overflow:hidden;
  display:flex;flex-direction:column;page-break-after:always;background:#F5F1E8}
.page:last-child{page-break-after:auto}
.eyebrow{font-size:23px;letter-spacing:.2em;color:#7A7468}
.top{display:flex;justify-content:space-between;align-items:baseline;border-bottom:1px solid rgba(22,19,15,.22);padding-bottom:20px}
.h1{font-size:88px;line-height:1.02;font-weight:700;letter-spacing:-.02em}
.h2{font-size:62px;line-height:1.14;font-weight:700;letter-spacing:-.01em}
.lead{font-size:32px;line-height:1.6}
.body{font-size:29px;line-height:1.62}
.small{font-size:22px;line-height:1.6;color:#7A7468}
.mono{font-family:Consolas,"Cascadia Mono",monospace;font-size:24px;line-height:1.55;
  background:#EDE7DA;padding:22px 24px;white-space:pre-wrap;word-break:break-all}
.accent{color:#B5342A}
.num{font-weight:700;letter-spacing:-.045em;line-height:.92}
.pn{position:absolute;right:80px;bottom:54px;font-size:21px;color:#7A7468;letter-spacing:.08em}
.mark{position:absolute;left:80px;bottom:54px;font-size:21px;color:#7A7468}
.grow{flex:1}
.row{display:flex;gap:28px;align-items:baseline;border-top:1px solid rgba(22,19,15,.16);padding-top:22px}
.dot{width:14px;height:14px;background:#B5342A;flex:none;transform:translateY(-6px)}
.cross{color:#B5342A;font-weight:700;font-size:30px;width:34px;flex:none}
</style></head><body><div class="page">
  <div class="top"><div class="eyebrow">安全边界</div><div class="eyebrow">每一条都是踩过坑加上的</div></div>
  <div class="h2" style="margin-top:40px">它不删东西，<br>也不自作主张</div>
  <div class="grow" style="display:flex;flex-direction:column;justify-content:center;gap:30px">
    <div class="row"><div class="dot"></div><div class="body"><b>不删</b>　草稿和空文件进 _trash，能捞回来</div></div>
    <div class="row"><div class="dot"></div><div class="body"><b>不猜</b>　没有清单，它不动手</div></div>
    <div class="row"><div class="dot"></div><div class="body"><b>不覆盖</b>　撞名了加 (2)，不悄悄盖掉</div></div>
    <div class="row"><div class="dot"></div><div class="body"><b>不乱退</b>　撤销前查位置、大小、修改时间</div></div>
    <div class="small" style="margin-top:6px">连 257 个 mac 留下的 4KB 小文件都还在原地 —— 因为没让它动。</div>
  </div>
<div class="mark">dsh-folder-janitor</div><div class="pn">04 / 07</div></div></body></html>
